<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Grade Weight Visualizer</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: Arial;
      background: #f2f4f8;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
    }

    h1 {
      text-align: center;
    }

    .row {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 60px;
      gap: 10px;
      margin-bottom: 10px;
    }

    input {
      padding: 8px;
      font-size: 16px;
    }

    button {
      padding: 10px;
      cursor: pointer;
      margin-top: 10px;
    }

    #chartBox {
      width: 450px;
      margin: 30px auto;
    }

    #final {
      text-align: center;
      font-size: 26px;
      margin-top: 15px;
    }

    .note {
      text-align: center;
      color: #555;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Grade Weight Visualizer</h1>

  <div class="note">
    Each slice = category weight. Colored = earned. Gray = missing (not completed).
  </div>

  <div class="row">
    <strong>Category</strong>
    <strong>Grade %</strong>
    <strong>Weight %</strong>
    <strong></strong>
  </div>

  <div id="rows"></div>

  <button onclick="addRow()">Add Category</button>
  <button onclick="calculate()">Calculate</button>

  <div id="final">Final Grade: 0%</div>

  <div id="chartBox">
    <canvas id="chart"></canvas>
  </div>

</div>

<script>

let chart;
let id = 0;

const colors = [
  "#4caf50","#2196f3","#ff9800","#9c27b0","#f44336",
  "#009688","#3f51b5","#795548","#e91e63","#607d8b"
];

function addRow(name="", grade="", weight="") {

  id++;

  const row = document.createElement("div");
  row.className = "row";
  row.id = "r" + id;

  row.innerHTML = `
    <input class="name" placeholder="Homework" value="${name}">
    <input class="grade" type="number" placeholder="90" value="${grade}">
    <input class="weight" type="number" placeholder="20" value="${weight}">
    <button onclick="removeRow('r${id}')">X</button>
  `;

  document.getElementById("rows").appendChild(row);
}

function removeRow(id) {
  document.getElementById(id).remove();
}

function calculate() {

  const rows = document.querySelectorAll(".row");

  let labels = [];
  let data = [];
  let bg = [];

  let earnedTotal = 0;
  let weightTotal = 0;

  let i = 0;

  rows.forEach(r => {

    const name = r.querySelector(".name").value || "Category";
    const grade = Number(r.querySelector(".grade").value);
    const weight = Number(r.querySelector(".weight").value);

    if (weight > 0) {

      const earned = weight * (grade / 100);
      const missing = weight - earned;

      // FIXED STRUCTURE: never redistribute
      labels.push(name + " Earned");
      data.push(earned);
      bg.push(colors[i % colors.length]);

      labels.push(name + " Missing");
      data.push(missing);
      bg.push("#e0e0e0");

      earnedTotal += earned;
      weightTotal += weight;

      i++;
    }
  });

  const final = weightTotal > 0
    ? (earnedTotal / weightTotal * 100).toFixed(1)
    : 0;

  document.getElementById("final").innerHTML =
    `Final Grade: <b>${final}%</b>`;

  if (chart) chart.destroy();

  const ctx = document.getElementById("chart");

  chart = new Chart(ctx, {
    type: "doughnut",
    data: {
      labels: labels,
      datasets: [{
        data: data,
        backgroundColor: bg,
        borderWidth: 2,
        borderColor: "#fff"
      }]
    },
    options: {
      cutout: "60%",
      responsive: true,
      plugins: {
        legend: {
          position: "bottom"
        }
      }
    }
  });
}

// starter rows
addRow("Homework", 90, 20);
addRow("Quizzes", 80, 30);
addRow("Tests", 70, 50);

</script>

</body>
</html>
