<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Grade Pie Chart Tool</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef2f7;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
    }

    .sub {
      text-align: center;
      color: #555;
      margin-bottom: 20px;
    }

    .row {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 60px;
      gap: 10px;
      margin-bottom: 10px;
    }

    input {
      padding: 10px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      padding: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    .add {
      background: #2e7d32;
      color: white;
      margin-top: 10px;
    }

    .calc {
      background: #1565c0;
      color: white;
      margin-top: 10px;
      margin-left: 10px;
    }

    .delete {
      background: #c62828;
      color: white;
    }

    #final {
      text-align: center;
      font-size: 26px;
      margin-top: 20px;
    }

    #chartBox {
      width: 420px;
      margin: 30px auto;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Grade Pie Chart Tool</h1>
  <div class="sub">
    Enter your categories, grades, and weights. Gray shows missing points.
  </div>

  <div class="row">
    <strong>Category</strong>
    <strong>Grade %</strong>
    <strong>Weight %</strong>
    <strong></strong>
  </div>

  <div id="rows"></div>

  <button class="add" onclick="addRow()">Add Category</button>
  <button class="calc" onclick="calculate()">Calculate</button>

  <div id="final">Final Grade: 0%</div>

  <div id="chartBox">
    <canvas id="chart"></canvas>
  </div>

</div>

<script>

let chart;
let id = 0;

const colors = [
  "#4caf50","#2196f3","#ff9800","#9c27b0","#f44336",
  "#009688","#3f51b5","#795548","#e91e63","#607d8b"
];

function addRow(name="", grade="", weight="") {

  if (id >= 10) return;

  id++;

  const row = document.createElement("div");
  row.className = "row";
  row.id = "r" + id;

  row.innerHTML = `
    <input class="name" placeholder="Homework" value="${name}">
    <input class="grade" type="number" placeholder="90" value="${grade}">
    <input class="weight" type="number" placeholder="20" value="${weight}">
    <button class="delete" onclick="removeRow('r${id}')">X</button>
  `;

  document.getElementById("rows").appendChild(row);
}

function removeRow(id) {
  document.getElementById(id).remove();
}

function calculate() {

  const rows = document.querySelectorAll(".row");

  let labels = [];
  let data = [];
  let bg = [];

  let earnedTotal = 0;
  let weightTotal = 0;

  let i = 0;

  rows.forEach(r => {

    const name = r.querySelector(".name").value || "Category";
    const grade = Number(r.querySelector(".grade").value);
    const weight = Number(r.querySelector(".weight").value);

    if (weight > 0) {

      const earned = weight * (grade / 100);
      const missing = weight - earned;

      labels.push(name + " (Earned)");
      data.push(earned);
      bg.push(colors[i % colors.length]);

      labels.push(name + " (Missing)");
      data.push(missing);
      bg.push("#d9d9d9");

      earnedTotal += earned;
      weightTotal += weight;

      i++;
    }
  });

  const final = weightTotal > 0
    ? (earnedTotal / weightTotal * 100).toFixed(1)
    : 0;

  document.getElementById("final").innerHTML =
    `Final Grade: <b>${final}%</b>`;

  if (chart) chart.destroy();

  chart = new Chart(document.getElementById("chart"), {
    type: "doughnut",
    data: {
      labels: labels,
      datasets: [{
        data: data,
        backgroundColor: bg,
        borderWidth: 2,
        borderColor: "#fff"
      }]
    },
    options: {
      cutout: "60%",
      plugins: {
        legend: {
          position: "bottom"
        }
      }
    }
  });
}

// starter rows
addRow("Homework", 90, 20);
addRow("Quizzes", 80, 30);
addRow("Tests", 70, 50);

</script>

</body>
</html>
