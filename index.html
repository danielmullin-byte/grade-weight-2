<!DOCTYPE html>
<html>
<head>
  <title>Grade Visualizer</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<canvas id="pieChart"></canvas>

<script>
let chart;

const ctx = document.getElementById('pieChart');

chart = new Chart(ctx, {
  type: 'pie',
  data: {
    labels: ['Homework', 'Tests', 'Quizzes'],
    datasets: [{
      data: [20, 50, 30]
    }]
  }
});
</script>

</body>
</html>
